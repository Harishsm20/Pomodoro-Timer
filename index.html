<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer Application</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body class="flex-column flex-center">
    <div class="timer-appliction flex-column flex-center box-radius" id="timer-appliction">
      <section class="add-task-form flex-column flex-center box-radius" id="add-task-input">
        <input type="text" id="task-name" placeholder="Task Name" />
        <textarea id="task-desc" placeholder="Task Description"></textarea>
        <input type="number" placeholder="Work time in minutes" min="0" max="180" id="task-mins">
        <input type="number" placeholder="Breaks" min="1" max="10" id="task-breaks">
        <button id="save-task" class="box-radius">Save Task</button>

        <span class="note box-radius">Note: 4th break is always Long break</span>
      </section>

      <header class="nav-bar">
        <div>
          <span>Pomodoro</span>
        </div>
        <div>
          <span class=" add-task linear-bg box-radius" id="add-task">Add Task</span>
        </div>
      </header>

      <section class="display-timer linear-bg flex-column flex-center box-radius">
        <div class="timer-type">
            <div>
                <input type="radio" name="timer" id="pomodoro" checked/>
                <label for="pomodoro">Pomodoro</label>
            </div>
            <div>
                <input type="radio" name="timer" id="short-break" />
                <label for="short-break">Short Break</label>
            </div>
            <div>
                <input type="radio" name="timer" id="long-break" />
                <label for="long-break">Long Break</label>
            </div>
        </div>

        <div class="time-display">
          <span id="display-timer">25:00</span>
        </div>
        <div class="start-button flex-column flex-center">
          <button class="box-radius" id="start-timer">START</button>
        </div>
      </section>

      <section class="display-tasks flex-column flex-center">
        <div class="task flex-column flex-center">
            <span>Task NO: 1</span>
            <span>Time to focus</span>
        </div>
        <div class="task flex-column flex-center">
            <span>Task NO: 2</span>
            <span>Time to focus</span>
        </div>
        <div class="task flex-column flex-center">
            <span>Task NO: 3</span>
            <span>Time to focus</span>
        </div>
        <div class="task flex-column flex-center">
            <span>Task NO: 4</span>
            <span>Time to focus</span>
        </div>
      </section>
    </div>
  </body>
  <script src="index.js"></script>
</html>
